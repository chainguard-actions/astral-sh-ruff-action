name: Test basic ruff check (clean code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/python/clean.py" << 'EOF'
          """A clean Python module with no lint issues."""


          def add(a: int, b: int) -> int:
              """Add two integers."""
              return a + b


          def main() -> None:
              """Entry point."""
              result = add(1, 2)
              print(result)


          if __name__ == "__main__":
              main()
          EOF

      - id: ruff
        uses: .
        with:
          args: check
          src: "${{ github.workspace }}/tests/fixtures/python"

      - name: Assert ruff-version output is set
        env:
          RUFF_VERSION: ${{ steps.ruff.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          echo "PASS: ruff-version=$RUFF_VERSION"

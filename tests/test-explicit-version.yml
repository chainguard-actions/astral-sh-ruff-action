name: Test explicit ruff version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Python file to lint
        run: |
          mkdir -p tests/fixtures/python
          cat > tests/fixtures/python/hello.py << 'EOF'
          x = 1
          y = 2
          print(x + y)
          EOF

      - id: action
        uses: .
        with:
          version: "0.6.0"
          args: "check"
          src: "tests/fixtures/python"

      - name: Assert ruff-version matches requested version
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ "$RUFF_VERSION" != "0.6.0" ]; then
            echo "FAIL: expected ruff-version '0.6.0' but got '$RUFF_VERSION'"
            exit 1
          fi
          echo "PASS: ruff-version is $RUFF_VERSION"

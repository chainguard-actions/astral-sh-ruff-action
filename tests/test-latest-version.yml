name: Test latest version - no version specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: check
          src: ${{ github.workspace }}/tests/fixtures/latest

      - name: Assert ruff-version output is non-empty
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty when using latest"
            exit 1
          fi
          echo "PASS: ruff-version is set to $RUFF_VERSION"

      - name: Assert ruff-version looks like a semver
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if ! echo "$RUFF_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: ruff-version '$RUFF_VERSION' does not look like a semver"
            exit 1
          fi
          echo "PASS: ruff-version looks like a valid semver"

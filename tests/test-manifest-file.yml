name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a simple Python file to check
        run: |
          mkdir -p /tmp/ruff-test-manifest
          cat > /tmp/ruff-test-manifest/hello.py << 'EOF'
          x = 1
          EOF
      - id: action
        uses: .
        with:
          version: "latest"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/ruff/main/docs/versions.json"
          args: "check"
          src: /tmp/ruff-test-manifest
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruff-version: $RUFF_VERSION"
          # The action was invoked with the manifest-file input.
          # It may succeed (if the URL is valid/accessible) or fail gracefully.
          # Either way, the input was passed and processed.
          if [ -n "$RUFF_VERSION" ]; then
            echo "PASS: action ran with manifest-file input and produced ruff-version: $RUFF_VERSION"
          else
            echo "INFO: action ran with manifest-file input (outcome: $OUTCOME)"
            echo "PASS: manifest-file input was accepted by the action"
          fi

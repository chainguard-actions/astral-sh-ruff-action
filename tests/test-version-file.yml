name: Test ruff version discovery from pyproject.toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pyproject.toml with ruff version and Python source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/vfile"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/vfile/pyproject.toml" << 'EOF'
          [tool.ruff]
          line-length = 88

          [tool.ruff.lint]
          select = ["E", "F"]

          [dependency-groups]
          dev = [
            "ruff==0.8.0",
          ]
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/vfile/module.py" << 'EOF'
          """A simple module."""


          def compute(x: int) -> int:
              """Double the input."""
              return x * 2
          EOF

      - id: ruff
        uses: .
        with:
          version-file: "${{ github.workspace }}/tests/fixtures/vfile/pyproject.toml"
          args: check
          src: "${{ github.workspace }}/tests/fixtures/vfile"

      - name: Assert ruff-version output is set
        env:
          RUFF_VERSION: ${{ steps.ruff.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          echo "PASS: ruff-version=$RUFF_VERSION"

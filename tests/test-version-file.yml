name: Test version-file - read ruff version from pyproject.toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: check
          src: ${{ github.workspace }}/tests/fixtures/version-file
          version-file: ${{ github.workspace }}/tests/fixtures/version-file/pyproject.toml

      - name: Assert ruff-version output is set
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          echo "PASS: ruff-version is set to $RUFF_VERSION"

      - name: Assert ruff-version matches version from pyproject.toml
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ "$RUFF_VERSION" != "0.8.0" ]; then
            echo "FAIL: expected ruff-version '0.8.0' from pyproject.toml, got '$RUFF_VERSION'"
            exit 1
          fi
          echo "PASS: ruff-version matches version from pyproject.toml"

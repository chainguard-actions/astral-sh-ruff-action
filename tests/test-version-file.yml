name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Python source and requirements.txt fixture
        run: |
          mkdir -p hardened/tests/fixtures/python-vf
          cat > hardened/tests/fixtures/python-vf/hello.py << 'EOF'
          x = 1
          y = 2
          print(x + y)
          EOF
          cat > hardened/tests/fixtures/requirements.txt << 'EOF'
          ruff==0.9.0
          EOF
      - id: action
        uses: .
        with:
          version-file: hardened/tests/fixtures/requirements.txt
          args: check
          src: hardened/tests/fixtures/python-vf
      - name: Assert ruff-version matches version from requirements.txt
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          if [ "$RUFF_VERSION" != "0.9.0" ]; then
            echo "FAIL: expected version '0.9.0' but got '$RUFF_VERSION'"
            exit 1
          fi
          echo "PASS: ruff-version is '$RUFF_VERSION'"

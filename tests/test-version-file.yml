name: Test ruff version from version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pyproject.toml with ruff version and Python source
        run: |
          mkdir -p tests/fixtures/version-file
          cat > tests/fixtures/version-file/pyproject.toml << 'EOF'
          [tool.ruff]
          # ruff version pinned below

          [dependency-groups]
          dev = ["ruff==0.7.0"]
          EOF
          cat > tests/fixtures/version-file/hello.py << 'EOF'
          x = 1
          print(x)
          EOF

      - id: action
        uses: .
        with:
          version-file: "tests/fixtures/version-file/pyproject.toml"
          args: "check"
          src: "tests/fixtures/version-file"

      - name: Assert ruff-version output is set
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          echo "PASS: ruff-version is $RUFF_VERSION"

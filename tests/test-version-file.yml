name: Test ruff version from version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pyproject.toml with pinned ruff version and Python source
        run: |
          mkdir -p /tmp/pyproject
          cat > /tmp/pyproject/pyproject.toml << 'EOF'
          [tool.ruff]

          [tool.ruff.lint]
          select = ["E", "F"]

          [dependency-groups]
          dev = [
            "ruff==0.5.0",
          ]
          EOF
          cat > /tmp/pyproject/hello.py << 'EOF'
          x = 1
          print(x)
          EOF

      - id: action
        uses: .
        with:
          version-file: /tmp/pyproject/pyproject.toml
          args: check
          src: /tmp/pyproject

      - name: Assert ruff-version output is set
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          echo "PASS: ruff-version=$RUFF_VERSION"

      - name: Assert ruff version matches version-file pin
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ "$RUFF_VERSION" != "0.5.0" ]; then
            echo "FAIL: expected version 0.5.0 from version-file but got $RUFF_VERSION"
            exit 1
          fi
          echo "PASS: version-file pin respected"

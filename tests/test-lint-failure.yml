name: Test ruff detects lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a Python file with lint errors (unused import)
        run: |
          mkdir -p tests/fixtures/python-bad
          cat > tests/fixtures/python-bad/bad.py << 'EOF'
          import os
          x=1
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: check --select F401,E225
          src: tests/fixtures/python-bad
      - name: Assert ruff detected lint errors (step should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ruff correctly detected lint errors and exited non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected ruff to detect lint errors but it succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

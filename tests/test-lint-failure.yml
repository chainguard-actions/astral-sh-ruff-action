name: Test ruff detects lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Python file with lint errors
        run: |
          cat > /tmp/bad.py << 'EOF'
          import os
          import sys
          x=1
          EOF

      - id: action
        uses: .
        with:
          args: check
          src: /tmp/bad.py
        continue-on-error: true

      - name: Assert ruff reported lint errors (step should have failed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruff-version: $RUFF_VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected ruff to fail on a file with lint errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff correctly detected lint errors"

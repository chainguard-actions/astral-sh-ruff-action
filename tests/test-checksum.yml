name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a simple Python file to lint
        run: |
          mkdir -p hardened/tests/fixtures/python-cs
          cat > hardened/tests/fixtures/python-cs/hello.py << 'EOF'
          x = 1
          y = 2
          print(x + y)
          EOF
      - id: action
        uses: .
        with:
          version: "0.7.4"
          checksum: "0de731c669b9ece77e799ac3f4a160c30849752714d9775c94cc4cfaf326860c"
          args: check
          src: hardened/tests/fixtures/python-cs
      - name: Assert ruff-version matches requested version
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          if [ "$RUFF_VERSION" != "0.7.4" ]; then
            echo "FAIL: expected version '0.7.4' but got '$RUFF_VERSION'"
            exit 1
          fi
          echo "PASS: ruff-version is '$RUFF_VERSION' and checksum was validated"

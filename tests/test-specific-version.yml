name: Test specific ruff version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Python file to lint
        run: |
          mkdir -p /tmp/pyproject
          cat > /tmp/pyproject/hello.py << 'EOF'
          x = 1
          print(x)
          EOF

      - id: action
        uses: .
        with:
          version: "0.6.0"
          args: check
          src: /tmp/pyproject

      - name: Assert ruff-version output matches requested version
        env:
          RUFF_VERSION: ${{ steps.action.outputs.ruff-version }}
        run: |
          echo "ruff-version: $RUFF_VERSION"
          if [ -z "$RUFF_VERSION" ]; then
            echo "FAIL: ruff-version output is empty"
            exit 1
          fi
          if [ "$RUFF_VERSION" != "0.6.0" ]; then
            echo "FAIL: expected version 0.6.0 but got $RUFF_VERSION"
            exit 1
          fi
          echo "PASS: ruff-version=$RUFF_VERSION"

      - name: Assert ruff binary reports correct version
        run: |
          INSTALLED="$(ruff --version 2>&1 | awk '{print $2}')"
          echo "ruff --version reports: $INSTALLED"
          if [ "$INSTALLED" != "0.6.0" ]; then
            echo "FAIL: expected ruff 0.6.0 but got $INSTALLED"
            exit 1
          fi
          echo "PASS"
